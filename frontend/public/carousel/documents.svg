<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <linearGradient id="bgGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>
    <filter id="shadow5" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0284C7" flood-opacity="0.08" />
    </filter>
  </defs>

  <rect width="600" height="600" fill="url(#bgGrad5)" />
  <rect x="20" y="20" width="560" height="560" rx="24" fill="none" stroke="#DDE3EC" stroke-width="2" />

  <!-- Badge -->
  <rect x="50" y="50" width="160" height="32" rx="16" fill="#E0F2FE" />
  <text x="70" y="71" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#0369A1" letter-spacing="0.5">CORE MODULE 05</text>

  <!-- Title & Subtitle -->
  <text x="50" y="125" font-family="Inter, sans-serif" font-size="28" font-weight="800" fill="#1B2433">Document Governance</text>
  <text x="50" y="155" font-family="Inter, sans-serif" font-size="14" font-weight="500" fill="#5A6678">Validity Tracking, Expiry Prevention &amp; Versioned Renewal</text>

  <!-- Content Box -->
  <g transform="translate(50, 180)">
    <!-- Document Card 1 -->
    <g transform="translate(0, 0)" filter="url(#shadow5)">
      <rect width="500" height="135" rx="16" fill="#FFFFFF" stroke="#DDE3EC" stroke-width="1.5" />
      <rect x="24" y="22" width="452" height="40" rx="8" fill="#F8FAFC" />
      <circle cx="44" cy="42" r="14" fill="#E0F2FE" />
      <path d="M40 38h8M40 42h8M40 46h5" stroke="#0284C7" stroke-width="2" stroke-linecap="round" />
      <text x="68" y="38" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#1B2433">Land Lease Agreement (30-Year Registered)</text>
      <text x="68" y="52" font-family="Inter, sans-serif" font-size="11" fill="#5A6678">Valid through 31 Dec 2045 &bull; SHA-256 Verified</text>
      <rect x="385" y="30" width="80" height="24" rx="12" fill="#E5F4EA" />
      <text x="425" y="46" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#1E6B3A" text-anchor="middle">Valid</text>

      <text x="24" y="85" font-family="Inter, sans-serif" font-size="12" fill="#5A6678">File: land_lease_registered_deed.pdf (4.2 MB) &bull; Magic byte check: application/pdf</text>
      <text x="24" y="108" font-family="Inter, sans-serif" font-size="11" font-family="monospace" fill="#0284C7">Checksum: e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b...</text>
    </g>

    <!-- Document Card 2 -->
    <g transform="translate(0, 155)" filter="url(#shadow5)">
      <rect width="500" height="135" rx="16" fill="#FFFFFF" stroke="#DDE3EC" stroke-width="1.5" />
      <rect x="24" y="22" width="452" height="40" rx="8" fill="#F8FAFC" />
      <circle cx="44" cy="42" r="14" fill="#FEF3C7" />
      <path d="M44 36v7M44 47h.01" stroke="#D97706" stroke-width="2" stroke-linecap="round" />
      <text x="68" y="38" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#1B2433">Building Safety &amp; Structural Stability Certificate</text>
      <text x="68" y="52" font-family="Inter, sans-serif" font-size="11" fill="#5A6678">Expires in 28 Days (15 Nov 2026) &bull; Renewal Requested</text>
      <rect x="375" y="30" width="90" height="24" rx="12" fill="#FFF3D6" />
      <text x="420" y="46" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#8A5A00" text-anchor="middle">Expiring Soon</text>

      <text x="24" y="85" font-family="Inter, sans-serif" font-size="12" fill="#5A6678">Previous Version: v1 &bull; Active Renewal Submission: v2 (Preserves Audit Link)</text>
      <text x="24" y="108" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#D97706">Alert sequence: 60d, 30d, 15d sent to Institution Registrar</text>
    </g>
  </g>

  <!-- Bottom Bar -->
  <g transform="translate(50, 520)">
    <rect width="500" height="40" rx="8" fill="#0284C7" />
    <text x="250" y="25" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">Cryptographic Checksums &bull; Version Retention &bull; Private Streaming</text>
  </g>
</svg>